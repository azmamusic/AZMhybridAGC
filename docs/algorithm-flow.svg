<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">AZMhybridAGC signal flow</title>
  <desc id="desc">The stereo input is measured as K-weighted power and plain power in overlapping 400 ms blocks. Gated histograms give Loudness and RMS, and the latest 400 ms window is blended in by Short Mix; these are mixed into a hybrid level. The target gain is averaged over 0.4 seconds, interpolated at a speed set by Push Down and Pull Up, and applied equally to both channels.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4 0 8Z" fill="#5f6b8a"/></marker></defs>
  <rect width="1000" height="430" rx="16" fill="#f3f5f9"/>
  <g font-family="Arial, sans-serif" fill="#1f2e54" text-anchor="middle">
    <g fill="#fff" stroke="#d5dbe8" stroke-width="1.5">
      <rect x="20" y="128" width="110" height="64" rx="9"/>
      <rect x="164" y="65" width="130" height="64" rx="9"/><rect x="164" y="191" width="130" height="64" rx="9"/>
      <rect x="337" y="65" width="145" height="64" rx="9"/><rect x="337" y="191" width="145" height="64" rx="9"/>
      <rect x="530" y="140" width="150" height="80" rx="9"/>
      <rect x="720" y="146" width="112" height="68" rx="9"/><rect x="864" y="146" width="110" height="68" rx="9"/>
      <rect x="864" y="271" width="110" height="64" rx="9"/><rect x="700" y="271" width="130" height="64" rx="9"/>
      <rect x="530" y="271" width="150" height="64" rx="9"/>
    </g>
    <g fill="none" stroke="#5f6b8a" stroke-width="2" marker-end="url(#arrow)">
      <path d="M130 160H147V97H164"/><path d="M130 160H147V223H164"/>
      <path d="M294 97H337"/><path d="M294 223H337"/>
      <path d="M482 97H506V170H530"/><path d="M482 223H506V190H530"/>
      <path d="M680 180H720"/><path d="M832 180H864"/>
      <path d="M919 214V271"/><path d="M864 303H830"/><path d="M700 303H680"/>
      <path d="M75 192V375H605V335"/>
    </g>
    <g font-size="16" font-weight="bold">
      <text x="75" y="153">Input L/R</text><text x="229" y="91">K-weighting</text><text x="229" y="217">Power</text>
      <text x="409" y="91">K block</text><text x="409" y="217">Power block</text>
      <text x="605" y="174">Gate</text><text x="776" y="174">Hybrid</text><text x="919" y="174">Target</text>
      <text x="919" y="297">Average</text><text x="765" y="297">Gain</text><text x="605" y="297">Output</text>
    </g>
    <g font-size="12" fill="#5f6b8a">
      <text x="75" y="174">stereo, full band</text><text x="229" y="111">ITU-R BS.1770</text><text x="229" y="237">before filtering</text>
      <text x="409" y="111">400 ms / 100 ms hop</text><text x="409" y="237">400 ms / 100 ms hop</text>
      <text x="605" y="194">-70 LUFS / -10 LU</text><text x="605" y="211">0.1 LU histogram</text>
      <text x="776" y="192">Ratio / Calibration</text><text x="776" y="207">+ Short Mix</text><text x="919" y="195">Push / Pull limit</text>
      <text x="919" y="317">0.4 s smoothing</text><text x="765" y="317">100 ms, limit-scaled</text><text x="605" y="317">L/R × same gain</text>
      <text x="305" y="397">Input L/R × linear gain → output L/R</text>
    </g>
  </g>
</svg>
